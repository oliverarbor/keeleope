<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F7F6F2" />
  <title>Köögikonsultandi inglise keel</title>

  <!-- Optional clean Inter font with instant system-ui fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       DESIGN TOKENS — Calm Scandinavian Interior Palette (Zero Corporate CVI)
       ========================================================================== */
    :root {
      --bg-outer: #EAE7DF;
      --bg-app: #F7F6F2;
      --surface: #FFFFFF;
      --surface-subtle: #F1EFE9;
      --border: #E3E0D6;
      --border-strong: #CFCBC0;

      --primary: #2D5A4C;        /* Deep forest sage */
      --primary-light: #3D7A68;  /* Lighter sage */
      --primary-soft: #E6F0EC;   /* Soft sage tint */

      --accent: #C86D51;         /* Warm terracotta */
      --accent-soft: #F9EBE6;    /* Soft terracotta tint */

      --amber-text: #8A5A19;
      --amber-bg: #FBF3E4;
      --amber-border: #EDD8B4;

      --danger: #B84A39;
      --danger-soft: #FBEAE7;

      --text-main: #1E242B;
      --text-muted: #5E6771;
      --text-faint: #8A939E;

      --shadow-card: 0 10px 30px -8px rgba(30, 36, 43, 0.08), 0 2px 6px -1px rgba(30, 36, 43, 0.04);
      --shadow-sm: 0 2px 6px rgba(30, 36, 43, 0.05);

      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button, input {
      font-family: inherit;
      color: inherit;
    }

    /* ==========================================================================
       APP SHELL — Centered Mobile Frame on Desktop, Full Viewport on Phone
       ========================================================================== */
    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 460px;
      height: 100%;
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 500px) {
      .app-shell {
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        box-shadow: 0 0 40px rgba(30, 36, 43, 0.08);
      }
    }

    /* ==========================================================================
       TOP COMPACT HEADER
       ========================================================================== */
    .top-bar {
      height: 52px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 10;
    }

    .filter-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 6px 12px 6px 9px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      max-width: 66%;
      min-height: 34px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .filter-pill-btn:active {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .filter-pill-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .counter-badge {
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .icon-toggle-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-toggle-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: var(--surface-subtle);
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }

    /* ==========================================================================
       MAIN STAGE AREA (ZERO PAGE SCROLL)
       ========================================================================== */
    .main-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-view {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-view.active {
      display: flex;
    }

    /* ==========================================================================
       TAB 1: ÕPI (SINGLE 3D FLASHCARD VIEW)
       ========================================================================== */
    .study-container {
      flex: 1;
      min-height: 0;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      overflow: hidden;
    }

    .card-scene {
      flex: 1;
      min-height: 0;
      perspective: 1200px;
      position: relative;
    }

    .flashcard-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .flashcard-3d.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .card-face.card-back {
      transform: rotateY(180deg);
      border: 2px solid var(--primary);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      background: var(--primary-soft);
      color: var(--primary);
      max-width: 72%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-badge.phrase-badge {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }

    .status-pill.mastered {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .status-pill.review {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .hint-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      min-height: 32px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .hint-btn.open {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }

    .card-center {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 4px 2px;
      overflow: hidden;
    }

    .eyebrow-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-faint);
      margin-bottom: 2px;
    }

    .front-main-term {
      font-size: clamp(20px, 5.4vw, 26px);
      font-weight: 800;
      line-height: 1.2;
      color: var(--text-main);
      margin: 0;
    }

    .front-phrase-prompt {
      font-size: clamp(16px, 4.4vw, 20px);
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-main);
      margin: 0;
    }

    .example-box {
      width: 100%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 11px 13px;
      text-align: center;
    }

    .example-box.en-box {
      background: var(--primary-soft);
      border-color: rgba(45, 90, 76, 0.22);
      text-align: left;
    }

    .example-text {
      font-size: clamp(13px, 3.7vw, 15px);
      font-weight: 600;
      line-height: 1.38;
      color: var(--text-main);
      margin: 0;
    }

    .hint-slot {
      min-height: 34px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hint-bubble {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: var(--amber-text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      line-height: 1.3;
    }

    .back-main-term {
      font-size: clamp(19px, 5vw, 24px);
      font-weight: 800;
      color: var(--primary);
      line-height: 1.22;
      margin: 0;
    }

    .back-main-sentence {
      font-size: clamp(15px, 4.1vw, 19px);
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.38;
      margin: 0;
    }

    .audio-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 7px 13px;
      border-radius: var(--radius-md);
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .audio-btn.secondary {
      background: var(--surface);
      color: var(--primary);
      border-color: var(--border-strong);
    }

    .audio-btn.speaking {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .audio-btn:active {
      transform: scale(0.97);
    }

    .card-footer-hint {
      flex-shrink: 0;
      padding-top: 8px;
      border-top: 1px solid var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
    }

    /* Study Bottom Action Row */
    .study-actions {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 46px 1fr 1fr 46px;
      gap: 8px;
      align-items: center;
    }

    .nav-arrow-btn {
      height: 48px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .nav-arrow-btn:active {
      background: var(--surface-subtle);
    }

    .mark-btn {
      height: 48px;
      border-radius: var(--radius-lg);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 0 10px;
      transition: transform 0.1s ease;
    }

    .mark-btn:active {
      transform: scale(0.98);
    }

    .mark-btn.review-btn {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: var(--amber-text);
    }

    .mark-btn.mastered-btn {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    /* Empty state when filter has 0 cards */
    .empty-card {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
    }

    .primary-action-btn {
      min-height: 44px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ==========================================================================
       TAB 2: HARJUTA (NO-SCROLL QUIZ & SENTENCE BUILDER)
       ========================================================================== */
    .practice-container {
      flex: 1;
      min-height: 0;
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
    }

    .mode-Header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .segmented-control {
      flex: 1;
      display: flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: var(--radius-md);
    }

    .seg-btn {
      flex: 1;
      min-height: 34px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .score-pill {
      padding: 7px 11px;
      border-radius: var(--radius-md);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .quiz-stage-card {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
    }

    .quiz-prompt-head {
      flex-shrink: 0;
      border-bottom: 1px solid var(--surface-subtle);
      padding-bottom: 8px;
    }

    .quiz-est-prompt {
      font-size: clamp(13px, 3.6vw, 15px);
      font-weight: 700;
      line-height: 1.32;
      color: var(--text-main);
      margin: 3px 0 0;
    }

    .blank-sentence-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 11px 13px;
      font-size: clamp(13px, 3.7vw, 15px);
      font-weight: 600;
      line-height: 1.42;
      color: var(--text-main);
    }

    .blank-slot {
      display: inline-block;
      min-width: 72px;
      border-bottom: 2px solid var(--primary);
      color: var(--primary);
      font-weight: 800;
      padding: 0 6px;
      margin: 0 2px;
      text-align: center;
    }

    .blank-slot.filled-correct {
      background: var(--primary-soft);
      border-radius: 6px;
    }

    .blank-slot.filled-wrong {
      background: var(--accent-soft);
      color: var(--danger);
      border-color: var(--danger);
      border-radius: 6px;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      flex-shrink: 0;
    }

    .choice-btn {
      min-height: 42px;
      padding: 8px 13px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .choice-btn:active:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .choice-btn.correct {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .choice-btn.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .choice-btn.dimmed {
      opacity: 0.52;
    }

    /* Sentence Builder */
    .builder-dropzone {
      min-height: 68px;
      padding: 9px;
      border-radius: var(--radius-lg);
      border: 1.5px dashed var(--border-strong);
      background: var(--surface-subtle);
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .builder-dropzone.correct {
      background: var(--primary-soft);
      border-style: solid;
      border-color: var(--primary);
    }

    .builder-dropzone.wrong {
      background: var(--danger-soft);
      border-style: solid;
      border-color: var(--danger);
    }

    .builder-placeholder {
      margin: auto;
      font-size: 12px;
      color: var(--text-faint);
      font-weight: 500;
    }

    .chunk-chip {
      padding: 6px 10px;
      min-height: 33px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-main);
      transition: transform 0.1s ease;
    }

    .chunk-chip:active {
      transform: scale(0.96);
    }

    .chunk-chip.placed {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .builder-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-end;
      flex-shrink: 0;
    }

    .correction-banner {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.32;
      flex-shrink: 0;
    }

    .practice-bottom-row {
      height: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .practice-main-btn {
      flex: 1;
      height: 46px;
      border-radius: var(--radius-lg);
      border: none;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .practice-main-btn:disabled {
      background: var(--border);
      color: var(--text-faint);
      cursor: not-allowed;
    }

    /* ==========================================================================
       TAB 3: ÜLEVAADE (SCROLLABLE STATS, FILTERS & DICTIONARY)
       ========================================================================== */
    .overview-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .panel-title {
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 10px;
      color: var(--text-main);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      padding: 10px 8px;
      border-radius: var(--radius-md);
      text-align: center;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
    }

    .stat-box.mastered {
      background: var(--primary-soft);
      border-color: rgba(45, 90, 76, 0.2);
      color: var(--primary);
    }

    .stat-box.review {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }

    .stat-num {
      font-size: 18px;
      font-weight: 800;
      display: block;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      margin-top: 3px;
      display: block;
    }

    .review-cta-btn {
      width: 100%;
      min-height: 44px;
      border-radius: var(--radius-md);

      /* ========================================================================
         SAFE LOCAL STORAGE & APPLICATION STATE
         ======================================================================== */
      const STORAGE_KEY = 'kitchen_consultant_en_progress_v1';

      function loadProgress() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (e) {
          return {};
        }
      }

      function saveProgress(map) {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
        } catch (e) {
          // Ignore iframe storage restrictions gracefully
        }
      }

      const state = {
        tab: 'study',             // 'study' | 'practice' | 'overview'

        practiceMode: 'choice',   // 'choice' | 'builder'

      /* ========================================================================
         UTILITIES & SPEECH SYNTHESIS
         ======================================================================== */
      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        return copy;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function speakText(text, rate) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const cleaned = text.replace(/\s*\/\s*/g, ' or ').replace(/\bcm\b/g, 'centimeters');
          const utter = new SpeechSynthesisUtterance(cleaned);
          utter.lang = 'en-GB';
          utter.rate = rate || 1.0;

          const voices = window.speechSynthesis.getVoices();
          const preferred =
            voices.find(function (v) { return v.lang === 'en-GB' && v.name.indexOf('Google') !== -1; }) ||
            voices.find(function (v) { return v.lang && v.lang.indexOf('en-GB') === 0; }) ||
            voices.find(function (v) { return v.lang && v.lang.indexOf('en-US') === 0; });
          if (preferred) utter.voice = preferred;

          window.speechSynthesis.speak(utter);
        } catch (e) {
          // Ignore speech errors
        }
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }

      function getActiveDeck() {
        const byId = {};
        CARDS.forEach(function (c) { byId[c.id] = c; });
        let list = state.deckOrder.map(function (id) { return byId[id]; }).filter(Boolean);

        if (state.filter === 'review_only') {
          list = list.filter(function (c) { return state.progress[c.id] === 'review'; });
        } else if (state.filter !== 'all') {
          list = list.filter(function (c) { return c.cat === state.filter; });
        }
        return list;
      }

      function renderHeader() {
        const deck = getActiveDeck();
        let label = 'Kõik kaardid';
        if (state.filter === 'review_only') {
          label = 'Kordamist vajavad';
        } else {
          const found = CATEGORIES.find(function (c) { return c.key === state.filter; });
          if (found) label = found.short;
        }

        if (state.tab === 'overview') {
          topFilterLabel.textContent = 'Ülevaade & sõnastik';
          const masteredCount = CARDS.filter(function (c) { return state.progress[c.id] === 'mastered'; }).length;
          topCounter.textContent = 'Selge ' + masteredCount + '/36';
          topProgressFill.style.width = Math.round((masteredCount / CARDS.length) * 100) + '%';
        } else if (state.tab === 'practice') {
          topFilterLabel.textContent = label;
          const total = state.quizQueue.length;
          const current = state.quizDone ? total : Math.min(state.quizIndex + 1, total);
          topCounter.textContent = total > 0 ? current + ' / ' + total : '0 / 0';
          topProgressFill.style.width = total > 0 ? Math.round((current / total) * 100) + '%' : '0%';
        } else {
          topFilterLabel.textContent = label;
          if (deck.length === 0) {
            topCounter.textContent = '0 / 0';
            topProgressFill.style.width = '100%';
          } else {
            const safeIdx = Math.min(state.cardIndex, deck.length - 1);
            topCounter.textContent = (safeIdx + 1) + ' / ' + deck.length;
            topProgressFill.style.width = Math.round(((safeIdx + 1) / deck.length) * 100) + '%';
          }

        shuffleBtn.classList.toggle('active', state.isShuffled);

          btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);

        document.getElementById('viewStudy').classList.toggle('active', tabName === 'study');
        document.getElementById('viewPractice').classList.toggle('active', tabName === 'practice');

        if (tabName === 'study') {
          renderStudy();
        } else if (tabName === 'practice') {
          startPracticeSession();
        } else if (tabName === 'overview') {
          renderOverview();
        }
        renderHeader();

        studyContent.innerHTML =

        renderStudy();

      function goPrevCard() {
        const deck = getActiveDeck();
        if (!deck.length) return;
        state.isFlipped = false;
        state.showHint = false;
        state.cardIndex = (state.cardIndex - 1 + deck.length) % deck.length;
        renderStudy();
      }

      function bindSwipeGestures(sceneEl, cardEl) {
        let startX = null;
        let startY = null;

        sceneEl.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) return;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }, { passive: true });

        sceneEl.addEventListener('touchmove', function (e) {
          if (startX === null || startY === null) return;
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 14) {
            const clamped = Math.max(-70, Math.min(70, dx * 0.4));
            cardEl.style.transform =
              'translateX(' + clamped + 'px) ' + (state.isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)');
          }
        }, { passive: true });

        sceneEl.addEventListener('touchend', function (e) {
          if (startX === null || startY === null) return;
          const dx = e.changedTouches[0].clientX - startX;
          const dy = e.changedTouches[0].clientY - startY;
          startX = null;
          startY = null;
          cardEl.style.transform = '';

          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
            if (dx < 0) goNextCard();
            else goPrevCard();
          }
        }, { passive: true });
      }

      /* ========================================================================
         TAB 2: HARJUTA (VALIKVASTUS & LAUSEEHITAJA)
         ======================================================================== */
      const quizStageCard = document.getElementById('quizStageCard');
      const quizBottomRow = document.getElementById('quizBottomRow');
      const quizScoreBadge = document.getElementById('quizScoreBadge');

      function buildChunksForSentence(sentence) {
        const words = sentence.split(' ');
        const targetCount = Math.min(6, Math.max(4, Math.ceil(words.length / 4)));
        const size = Math.ceil(words.length / targetCount);
        const chunks = [];
        for (let i = 0; i < words.length; i += size) {
          chunks.push(words.slice(i, i + size).join(' '));
        }
        return chunks;
      }

      function startPracticeSession() {
        let pool = getActiveDeck();
        if (pool.length < 4) pool = CARDS.slice();

        const selected = shuffleArray(pool).slice(0, Math.min(10, pool.length));
        state.quizQueue = selected.map(function (card) {
          const fullEn = card.type === 'vocab' ? card.en_ex : card.en;
          const promptEt = card.type === 'vocab' ? card.et + ' — „' + card.et_ex + '“' : card.et;
          const options = shuffleArray([card.target].concat(card.distractors));
          const rawChunks = buildChunksForSentence(fullEn);
          return {
            card: card,
            fullEn: fullEn,
            promptEt: promptEt,
            target: card.target,
            options: options,
            rawChunks: rawChunks
          };
        });

        state.quizIndex = 0;
        state.quizScore = 0;
        state.quizDone = false;
        prepareCurrentQuizItem();
        renderPractice();
      }

      function prepareCurrentQuizItem() {
        state.pickedOption = null;
        state.builderStatus = null;
        state.builtChunks = [];
        const item = state.quizQueue[state.quizIndex];
        if (item) {
          state.poolChunks = shuffleArray(
            item.rawChunks.map(function (text, idx) {
              return { id: idx, text: text };
            })
          );
        } else {
          state.poolChunks = [];
        }
      }

      function formatBlankSentence(fullEn, target, picked) {
        const escapedTarget = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp('(' + escapedTarget + ')', 'i');
        const parts = fullEn.split(regex);

        return parts.map(function (part) {
          if (part.toLowerCase() === target.toLowerCase()) {
            if (!picked) {
              return '<span class="blank-slot">_____</span>';
            }
            const isCorrect = picked.toLowerCase() === target.toLowerCase();
            return (
              '<span class="blank-slot ' + (isCorrect ? 'filled-correct' : 'filled-wrong') + '">' +
                escapeHtml(part) +
              '</span>'
            );
          }
          return escapeHtml(part);
        }).join('');
      }

      function renderPractice() {
        renderHeader();
        const total = state.quizQueue.length;
        quizScoreBadge.textContent = state.quizScore + ' / ' + total;

        document.getElementById('modeChoiceBtn').classList.toggle('active', state.practiceMode === 'choice');
        document.getElementById('modeBuilderBtn').classList.toggle('active', state.practiceMode === 'builder');

        if (state.quizDone || !state.quizQueue.length) {
          quizStageCard.innerHTML =
            '<div style="margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;">' +
              '<div style="width:52px;height:52px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;">✓</div>' +
              '<h2 style="margin:0;font-size:20px;font-weight:800;">Harjutusvoor tehtud!</h2>' +
              '<p style="margin:0;font-size:14px;color:var(--text-muted);">Sinu tulemus: <strong style="color:var(--primary);">' + state.quizScore + ' / ' + total + '</strong> õiget</p>' +
            '</div>';

          quizBottomRow.innerHTML =
            '<button type="button" id="restartQuizBtn" class="practice-main-btn">Alusta uut vooru</button>';

          document.getElementById('restartQuizBtn').addEventListener('click', startPracticeSession);
          return;
        }

        const item = state.quizQueue[state.quizIndex];

        if (state.practiceMode === 'choice') {
          const choicesHtml = item.options.map(function (opt) {
            let cls = 'choice-btn';
            let icon = '';
            if (state.pickedOption !== null) {
              const isRight = opt.toLowerCase() === item.target.toLowerCase();
              const isPicked = opt === state.pickedOption;
              if (isRight) {
                cls += ' correct';
                icon = '<span>✓</span>';
              } else if (isPicked) {
                cls += ' wrong';
                icon = '<span>✕</span>';
              } else {
                cls += ' dimmed';
              }
            }
            return (
              '<button type="button" class="' + cls + '" data-opt="' + escapeHtml(opt) + '" ' +
              (state.pickedOption !== null ? 'disabled' : '') + '>' +
                '<span>' + escapeHtml(opt) + '</span>' + icon +
              '</button>'
            );
          }).join('');

          quizStageCard.innerHTML =
            '<div class="quiz-prompt-head">' +
              '<span class="eyebrow-label">' + escapeHtml(item.card.badge) + '</span>' +
              '<p class="quiz-est-prompt">' + escapeHtml(item.promptEt) + '</p>' +
            '</div>' +
            '<div class="blank-sentence-box">' +
              formatBlankSentence(item.fullEn, item.target, state.pickedOption) +
            '</div>' +
            '<div class="choices-grid">' + choicesHtml + '</div>';

          quizStageCard.querySelectorAll('[data-opt]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              if (state.pickedOption !== null) return;
              const chosen = btn.getAttribute('data-opt');
              state.pickedOption = chosen;
              if (chosen.toLowerCase() === item.target.toLowerCase()) {
                state.quizScore += 1;
              }
              speakText(item.fullEn, 1.0);
              renderPractice();
            });
          });

          quizBottomRow.innerHTML =
            '<button type="button" id="quizListenBtn" class="audio-btn secondary" style="height:46px;">🔊 Kuula</button>' +
            '<button type="button" id="quizNextBtn" class="practice-main-btn" ' +
            (state.pickedOption === null ? 'disabled' : '') + '>' +
              (state.quizIndex + 1 >= total ? 'Vaata tulemust →' : 'Järgmine →') +
            '</button>';
        } else {
          // Sentence Builder mode
          const dropClass =
            'builder-dropzone' +
            (state.builderStatus === 'correct' ? ' correct' : state.builderStatus === 'wrong' ? ' wrong' : '');

          const placedHtml = state.builtChunks.length === 0
            ? '<span class="builder-placeholder">Puuduta allolevaid fraase õiges järjekorras...</span>'
            : state.builtChunks.map(function (ch) {
                return '<button type="button" class="chunk-chip placed" data-remove="' + ch.id + '">' + escapeHtml(ch.text) + '</button>';
              }).join('');

          const poolHtml = state.poolChunks.map(function (ch) {
            return '<button type="button" class="chunk-chip" data-add="' + ch.id + '">' + escapeHtml(ch.text) + '</button>';
          }).join('');

          const correctionHtml = state.builderStatus === 'wrong'
            ? '<div class="correction-banner"><strong style="color:var(--primary);">Õige lause:</strong> ' + escapeHtml(item.fullEn) + '</div>'
            : '';

          quizStageCard.innerHTML =
            '<div class="quiz-prompt-head">' +
              '<span class="eyebrow-label">' + escapeHtml(item.card.badge) + '</span>' +
              '<p class="quiz-est-prompt">' + escapeHtml(item.promptEt) + '</p>' +
            '</div>' +
            '<div class="' + dropClass + '">' + placedHtml + '</div>' +
            correctionHtml +
            '<div class="builder-pool">' + poolHtml + '</div>';

          quizStageCard.querySelectorAll('[data-add]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              if (state.builderStatus === 'correct') return;
              const id = parseInt(btn.getAttribute('data-add'), 10);
              const found = state.poolChunks.find(function (c) { return c.id === id; });
              if (!found) return;
              state.builderStatus = null;
              state.poolChunks = state.poolChunks.filter(function (c) { return c.id !== id; });
              state.builtChunks.push(found);
              renderPractice();
            });
          });

          quizStageCard.querySelectorAll('[data-remove]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              if (state.builderStatus === 'correct') return;
              const id = parseInt(btn.getAttribute('data-remove'), 10);
              const found = state.builtChunks.find(function (c) { return c.id === id; });
              if (!found) return;
              state.builderStatus = null;
              state.builtChunks = state.builtChunks.filter(function (c) { return c.id !== id; });
              state.poolChunks.push(found);
              renderPractice();
            });
          });

          if (state.builderStatus === null) {
            quizBottomRow.innerHTML =
              '<button type="button" id="quizListenBtn" class="audio-btn secondary" style="height:46px;">🔊 Vihje</button>' +
              '<button type="button" id="quizCheckBtn" class="practice-main-btn" ' +
              (state.poolChunks.length > 0 ? 'disabled' : '') + '>Kontrolli</button>';
          } else {
            quizBottomRow.innerHTML =
              '<button type="button" id="quizListenBtn" class="audio-btn secondary" style="height:46px;">🔊 Kuula</button>' +
              '<button type="button" id="quizNextBtn" class="practice-main-btn">' +
                (state.quizIndex + 1 >= total ? 'Vaata tulemust →' : 'Järgmine →') +
              '</button>';
          }
        }

        const listenBtn = document.getElementById('quizListenBtn');
        if (listenBtn) {
          listenBtn.addEventListener('click', function () {
            speakText(item.fullEn, 0.95);
          });
        }

        const checkBtn = document.getElementById('quizCheckBtn');
        if (checkBtn) {
          checkBtn.addEventListener('click', function () {
            const attempt = state.builtChunks.map(function (c) { return c.text; }).join(' ');
            if (attempt === item.fullEn) {
              state.builderStatus = 'correct';
              state.quizScore += 1;
            } else {
              state.builderStatus = 'wrong';
            }
            speakText(item.fullEn, 1.0);
            renderPractice();
          });
        }

        const nextBtn = document.getElementById('quizNextBtn');
        if (nextBtn) {
          nextBtn.addEventListener('click', function () {
            if (state.quizIndex + 1 >= state.quizQueue.length) {
              state.quizDone = true;
            } else {
              state.quizIndex += 1;
              prepareCurrentQuizItem();
            }
            renderPractice();
          });
        }
      }

      /* ========================================================================
         TAB 3: ÜLEVAADE (STATS, TOPIC LAUNCHER & SEARCHABLE DICTIONARY)
         ======================================================================== */
      function renderOverview() {
        renderHeader();

        let masteredCount = 0;
        let reviewCount = 0;
        CARDS.forEach(function (c) {
          if (state.progress[c.id] === 'mastered') masteredCount += 1;
          else if (state.progress[c.id] === 'review') reviewCount += 1;
        });
        const unseenCount = CARDS.length - masteredCount - reviewCount;

        document.getElementById('statMastered').textContent = masteredCount;
        document.getElementById('statReview').textContent = reviewCount;
        document.getElementById('statUnseen').textContent = unseenCount;

        const reviewBtn = document.getElementById('studyReviewBtn');
        reviewBtn.textContent = 'Õpi kordamist vajavaid (' + reviewCount + ')';
        reviewBtn.disabled = reviewCount === 0;

        // Inline Reset Confirmation (Never uses browser confirm/alert)
        const resetContainer = document.getElementById('resetContainer');
        if (state.confirmingReset) {
          resetContainer.innerHTML =
            '<button type="button" id="confirmResetYes" class="text-link-btn danger">Kinnita nullimine</button> ' +
            '<button type="button" id="confirmResetNo" class="text-link-btn">Loobu</button>';

          document.getElementById('confirmResetYes').addEventListener('click', function () {
            state.progress = {};
            saveProgress(state.progress);
            state.confirmingReset = false;
            if (state.filter === 'review_only') state.filter = 'all';
            renderOverview();
          });
          document.getElementById('confirmResetNo').addEventListener('click', function () {
            state.confirmingReset = false;
            renderOverview();
          });
        } else {
          resetContainer.innerHTML =
            '<button type="button" id="resetTriggerBtn" class="text-link-btn">Nulli progress</button>';
          document.getElementById('resetTriggerBtn').addEventListener('click', function () {
            state.confirmingReset = true;
            renderOverview();
          });
        }

        // Category rows
        const categoryList = document.getElementById('categoryList');
        categoryList.innerHTML = CATEGORIES.map(function (cat) {
          const count = cat.key === 'all'
            ? CARDS.length
            : CARDS.filter(function (c) { return c.cat === cat.key; }).length;
          const isSelected = state.overviewCategory === cat.key;

          return (
            '<div class="cat-row-item' + (isSelected ? ' selected' : '') + '" data-filter-cat="' + cat.key + '">' +
              '<div>' +
                '<div class="cat-row-title">' + escapeHtml(cat.label) + ' (' + count + ')</div>' +
              '</div>' +
              '<button type="button" class="start-topic-btn" data-launch-cat="' + cat.key + '">Alusta teemat</button>' +
            '</div>'
          );
        }).join('');

        categoryList.querySelectorAll('[data-filter-cat]').forEach(function (row) {
          row.addEventListener('click', function (e) {
            if (e.target.closest('[data-launch-cat]')) return;
            state.overviewCategory = row.getAttribute('data-filter-cat');
            renderOverview();
          });
        });

        categoryList.querySelectorAll('[data-launch-cat]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            state.filter = btn.getAttribute('data-launch-cat');
            state.cardIndex = 0;
            state.isFlipped = false;
            state.showHint = false;
            switchTab('study');
          });
        });

        // Filtered dictionary list
        const query = state.searchQuery.trim().toLowerCase();
        const filteredCards = CARDS.filter(function (c) {
          if (state.overviewCategory !== 'all' && c.cat !== state.overviewCategory) {
            return false;
          }
          if (!query) return true;
          const haystack = [c.et, c.et_ex || '', c.en, c.en_ex || '', c.badge].join(' ').toLowerCase();
          return haystack.indexOf(query) !== -1;
        });

        document.getElementById('dictHeading').textContent =
          'Sõnastik ja laused (' + filteredCards.length + ')';

        const dictList = document.getElementById('dictList');
        if (filteredCards.length === 0) {
          dictList.innerHTML =
            '<p style="font-size:12px;color:var(--text-muted);text-align:center;padding:16px 0;margin:0;">Otsingule vastavaid kaarte ei leitud.</p>';
          return;
        }

        dictList.innerHTML = filteredCards.map(function (c) {
          const st = state.progress[c.id];
          const stLabel = st === 'mastered' ? '• Selge' : st === 'review' ? '• Kordamiseks' : '';
          const stColor = st === 'mastered' ? 'var(--primary)' : 'var(--accent)';
          const subEn = c.type === 'vocab' ? c.en + ' — “' + c.en_ex + '”' : c.en;

          return (
            '<div class="dict-item" data-open-card="' + c.id + '">' +
              '<div class="dict-item-body">' +
                '<div class="dict-meta">' +
                  '<span>' + escapeHtml(c.badge) + '</span>' +
                  (stLabel ? '<span style="color:' + stColor + ';">' + stLabel + '</span>' : '') +
                '</div>' +
                '<p class="dict-et">' + escapeHtml(c.et) + '</p>' +
                '<p class="dict-en">' + escapeHtml(subEn) + '</p>' +
              '</div>' +
              '<button type="button" class="mini-audio-btn" data-dict-speak="' + c.id + '" aria-label="Kuula hääldust">🔊</button>' +
            '</div>'
          );
        }).join('');

        dictList.querySelectorAll('[data-dict-speak]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const id = parseInt(btn.getAttribute('data-dict-speak'), 10);
            const card = CARDS.find(function (c) { return c.id === id; });
            if (card) {
              speakText(card.type === 'vocab' ? card.en + '. ' + card.en_ex : card.en, 0.96);
            }
          });
        });

        dictList.querySelectorAll('[data-open-card]').forEach(function (row) {
          row.addEventListener('click', function () {
            const id = parseInt(row.getAttribute('data-open-card'), 10);
            state.filter = 'all';
            const idx = state.deckOrder.indexOf(id);
            state.cardIndex = idx >= 0 ? idx : 0;
            state.isFlipped = false;
            state.showHint = false;
            switchTab('study');
          });
        });
      }

      /* ========================================================================
         GLOBAL LISTENERS & KEYBOARD NAVIGATION
         ======================================================================== */
      document.querySelectorAll('.nav-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          switchTab(btn.getAttribute('data-tab'));
        });
      });

      topFilterBtn.addEventListener('click', function () {
        if (state.tab !== 'overview') {
          switchTab('overview');
        } else {
          switchTab('study');
        }
      });

      shuffleBtn.addEventListener('click', function () {
        state.isShuffled = !state.isShuffled;
        state.deckOrder = state.isShuffled
          ? shuffleArray(CARDS.map(function (c) { return c.id; }))
          : CARDS.map(function (c) { return c.id; });
        state.cardIndex = 0;
        state.isFlipped = false;
        if (state.tab === 'study') renderStudy();
        else if (state.tab === 'practice') startPracticeSession();
        else renderHeader();
      });

      document.getElementById('modeChoiceBtn').addEventListener('click', function () {
        if (state.practiceMode === 'choice') return;
        state.practiceMode = 'choice';
        startPracticeSession();
      });

      document.getElementById('modeBuilderBtn').addEventListener('click', function () {
        if (state.practiceMode === 'builder') return;
        state.practiceMode = 'builder';
        startPracticeSession();
      });

      document.getElementById('studyReviewBtn').addEventListener('click', function () {
        state.filter = 'review_only';
        state.cardIndex = 0;
        state.isFlipped = false;
        switchTab('study');
      });

      document.getElementById('studyAllBtn').addEventListener('click', function () {
        state.filter = 'all';
        state.cardIndex = 0;
        state.isFlipped = false;
        switchTab('study');
      });

      document.getElementById('searchInput').addEventListener('input', function (e) {
        state.searchQuery = e.target.value || '';
        renderOverview();
      });

      window.addEventListener('keydown', function (e) {
        if (state.tab !== 'study') return;
        const activeTag = document.activeElement && document.activeElement.tagName;
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          state.isFlipped = !state.isFlipped;
          const cardEl = document.getElementById('flashcard3d');
          if (cardEl) cardEl.classList.toggle('is-flipped', state.isFlipped);
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          goNextCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          goPrevCard();
        }
      });

      // Initial render
      renderStudy();
    })();
  </script>
</body>
</html>
